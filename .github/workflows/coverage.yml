name: Coverage

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  coverage:
    name: Linux - Coverage (gcov/lcov)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            ninja-build \
            cmake \
            gcc-14 \
            g++-14 \
            lcov \
            libasound2-dev \
            libx11-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxcursor-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            libpng-dev

      - name: Fix freetype include path
        run: |
          sudo ln -sf /usr/include/freetype2/ft2build.h /usr/include/ft2build.h
          sudo ln -sf /usr/include/freetype2/freetype /usr/include/freetype

      - name: Configure with coverage flags
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          cmake --preset linux \
            -DCMAKE_C_FLAGS="--coverage" \
            -DCMAKE_CXX_FLAGS="--coverage" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage" \
            -DCMAKE_SHARED_LINKER_FLAGS="--coverage"

      - name: Build
        run: cmake --build --preset linux

      - name: Run tests
        run: ctest --preset linux --output-on-failure

      - name: Generate coverage report
        # lcov/geninfo can report false-positive exception-tag mismatches
        # in transitive system/dependency headers; those paths are filtered
        # out below from the published report.
        run: |
          lcov \
            --capture \
            --directory build/linux \
            --gcov-tool /usr/bin/gcov-14 \
            --ignore-errors mismatch \
            --output-file coverage.info \
            --rc branch_coverage=1

          # Keep report focused on plugin application code (exclude dependencies/test code).
          lcov \
            --remove coverage.info \
            '/usr/*' \
            '*/_deps/*' \
            '*/tests/*' \
            '*/CMakeFiles/*' \
            --output-file coverage.filtered.info \
            --rc branch_coverage=1

          genhtml \
            coverage.filtered.info \
            --output-directory coverage-html \
            --branch-coverage

      - name: Upload lcov and HTML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.filtered.info
            coverage-html
